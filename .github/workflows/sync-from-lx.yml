name: Sync from public LX

on:
  workflow_dispatch:
  schedule:
    # hourly, off the hour to avoid the scheduler's peak
    - cron: "17 * * * *"

permissions:
  contents: write
  issues: write
  pull-requests: read

env:
  UPSTREAM_REPO: duckietown/lx-dd-altitude-pid-control
  UPSTREAM_BRANCH: ente
  SYNC_BRANCH: sync/upstream-ente
  SYNC_LABEL: upstream-sync
  # GitHub users notified when a sync is needed
  MENTION: "@JatinVira"

jobs:
  sync:
    # This file is kept identical in the public LX and in its solution
    # repository, so syncing never changes a workflow file. It only runs in
    # the solution repository.
    if: github.repository == 'duckietown/lx-dd-altitude-pid-control-solution'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ente
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "${UPSTREAM_BRANCH}"

      - name: Push the sync branch and open or update the sync issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          UPSTREAM_SHA=$(git rev-parse "upstream/${UPSTREAM_BRANCH}")
          SHORT_SHA=$(git rev-parse --short "${UPSTREAM_SHA}")
          echo "upstream ${UPSTREAM_REPO}@${UPSTREAM_BRANCH} is ${UPSTREAM_SHA}"

          ISSUE=$(gh issue list --label "${SYNC_LABEL}" --state open --json number --jq '.[0].number // empty')

          if git merge-base --is-ancestor "${UPSTREAM_SHA}" origin/ente; then
            echo "ente already contains every upstream commit, nothing to sync"
            if [ -n "${ISSUE}" ]; then
              gh issue close "${ISSUE}" --comment "\`ente\` now contains \`${UPSTREAM_REPO}@${SHORT_SHA}\`, sync complete."
            fi
            exit 0
          fi

          git push --force origin "${UPSTREAM_SHA}:refs/heads/${SYNC_BRANCH}"

          PR_URL=$(gh pr list --head "${SYNC_BRANCH}" --base ente --state open --json url --jq '.[0].url // empty')
          TITLE="chore: sync solutions with ${UPSTREAM_REPO}@${UPSTREAM_BRANCH}"
          COMMITS=$(git log --format='- %h %s' "origin/ente..${UPSTREAM_SHA}")

          gh label create "${SYNC_LABEL}" --color 0E8A16 --description "Public LX changed, sync PR needed" --force

          if [ -z "${ISSUE}" ]; then
            ISSUE=$(gh issue create --title "Public LX changed, sync PR needed" --label "${SYNC_LABEL}" --body "Opening..." | grep -o '[0-9]*$')
            NEW_ISSUE=1
          else
            NEW_ISSUE=0
          fi

          {
            echo "Automated sync from [\`${UPSTREAM_REPO}\`](https://github.com/${UPSTREAM_REPO}/tree/${UPSTREAM_BRANCH}), now at \`${UPSTREAM_SHA}\`."
            echo
            echo "Upstream commits not yet in this repository:"
            echo
            echo "${COMMITS}"
            echo
            echo "Conflicts are expected on files that intentionally diverge here (the files under"
            echo "packages/solution/ that hold the solutions). Resolve them by keeping the solution"
            echo "version and folding in what genuinely changed upstream. Do not merge this without"
            echo "reading the diff."
            echo
            echo "Merge with **Create a merge commit**, never squash or rebase."
            echo
            echo "Closes #${ISSUE}"
          } > "${RUNNER_TEMP}/pr-body.md"

          {
            echo "${MENTION} \`${UPSTREAM_REPO}@${UPSTREAM_BRANCH}\` is now at \`${SHORT_SHA}\`. Commits not yet in this repository:"
            echo
            echo "${COMMITS}"
            echo
            if [ -n "${PR_URL}" ]; then
              echo "The sync pull request is already open and now includes these commits: ${PR_URL}"
            else
              Q_TITLE=$(printf '%s' "${TITLE}" | jq -sRr @uri)
              Q_BODY=$(jq -sRr @uri < "${RUNNER_TEMP}/pr-body.md")
              echo "**[Create the sync pull request](https://github.com/${GITHUB_REPOSITORY}/compare/ente...${SYNC_BRANCH}?expand=1&title=${Q_TITLE}&body=${Q_BODY})**"
            fi
            echo
            echo "Merge it with **Create a merge commit**. This issue closes once the sync is merged."
          } > "${RUNNER_TEMP}/issue-body.md"

          if [ "${NEW_ISSUE}" = "1" ] || ! gh issue view "${ISSUE}" --json body --jq .body | grep -q "${SHORT_SHA}"; then
            gh issue edit "${ISSUE}" --body-file "${RUNNER_TEMP}/issue-body.md"
            # mentions added by an edit do not notify, a comment does
            gh issue comment "${ISSUE}" --body "${MENTION} \`${UPSTREAM_REPO}\` is now at \`${SHORT_SHA}\`, a sync is needed (details above)."
          fi
          echo "sync issue: #${ISSUE}"
