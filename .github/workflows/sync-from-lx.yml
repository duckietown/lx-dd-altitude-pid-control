name: Sync from public LX

on:
  workflow_dispatch:
  schedule:
    # hourly, off the hour to avoid the scheduler's peak
    - cron: "17 * * * *"

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REPO: duckietown/lx-dd-altitude-pid-control
  UPSTREAM_BRANCH: ente
  SYNC_BRANCH: sync/upstream-ente

jobs:
  sync:
    # This file is kept identical in the public LX and in its solution
    # repository, so syncing never changes a workflow file. It only runs in
    # the solution repository.
    if: github.repository == 'duckietown/lx-dd-altitude-pid-control-solution'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ente
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "${UPSTREAM_BRANCH}"

      - name: Open or update the sync pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          UPSTREAM_SHA=$(git rev-parse "upstream/${UPSTREAM_BRANCH}")
          echo "upstream ${UPSTREAM_REPO}@${UPSTREAM_BRANCH} is ${UPSTREAM_SHA}"

          if git merge-base --is-ancestor "${UPSTREAM_SHA}" origin/ente; then
            echo "ente already contains every upstream commit, nothing to sync"
            exit 0
          fi

          git push --force origin "${UPSTREAM_SHA}:refs/heads/${SYNC_BRANCH}"

          OPEN=$(gh pr list --head "${SYNC_BRANCH}" --base ente --state open --json number --jq '.[].number')
          if [ -n "${OPEN}" ]; then
            echo "pull request #${OPEN} is already open, it now points at ${UPSTREAM_SHA}"
            exit 0
          fi

          {
            echo "Automated sync from [\`${UPSTREAM_REPO}\`](https://github.com/${UPSTREAM_REPO}/tree/${UPSTREAM_BRANCH}), now at \`${UPSTREAM_SHA}\`."
            echo
            echo "Upstream commits not yet in this repository:"
            echo
            git log --format='- %h %s' "origin/ente..${UPSTREAM_SHA}"
            echo
            echo "Conflicts are expected on files that intentionally diverge here (the files under"
            echo "packages/solution/ that hold the solutions). Resolve them by keeping the solution"
            echo "version and folding in what genuinely changed upstream. Do not merge this without"
            echo "reading the diff."
          } > "${RUNNER_TEMP}/pr-body.md"

          gh pr create \
            --base ente \
            --head "${SYNC_BRANCH}" \
            --title "chore: sync solutions with ${UPSTREAM_REPO}@${UPSTREAM_BRANCH}" \
            --body-file "${RUNNER_TEMP}/pr-body.md"
